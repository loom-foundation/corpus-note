name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./check
  docs:
    # The docs renderer lives in the sibling app-note-docs-site repo; the
    # docs SOURCE stays here. Four repositories are checked out mirroring the
    # west workspace, because the renderer resolves its siblings through the
    # root: the corpus it renders, the renderer itself, org for the brand
    # assets it copies in at build time, and the workspace whose west.yml
    # marks the root, symlinked into place exactly as a real checkout does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: corpora/note
      - uses: actions/checkout@v7
        with:
          repository: loom-foundation/app-note-docs-site
          path: apps/note-docs-site
      - uses: actions/checkout@v7
        with:
          repository: loom-foundation/org
          path: org
      - uses: actions/checkout@v7
        with:
          repository: loom-foundation/workspace
          path: workspace
      - run: ln -s workspace/west.yml west.yml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
        working-directory: apps/note-docs-site
      - run: npm run docs:build
        working-directory: apps/note-docs-site
