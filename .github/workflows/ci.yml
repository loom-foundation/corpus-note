name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./check
  docs:
    # The docs renderer lives in the sibling app-note-docs-site repo; the docs
    # SOURCE stays here. The renderer resolves its siblings through the
    # workspace root, so it is built inside one: the manifest repository is
    # checked out and west places what it names, at the paths and revisions
    # west.yml declares.
    #
    # The corpus is not among them. This job renders the branch under test, so
    # it is checked out here and left where west would have put it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: corpora/note
      - uses: actions/checkout@v7
        with:
          repository: loom-foundation/workspace
          path: workspace
      # west is held to a minor series: unpinned, a release of it could stop
      # every build here without a line changing in any Loom repository. A
      # major version is where the manifest format itself may change.
      - run: pipx install 'west~=1.5'
      - run: west init -l workspace
      - run: west update --narrow -o=--depth=1 app-note-docs-site org
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
        working-directory: apps/note-docs-site
      - run: npm run docs:build
        working-directory: apps/note-docs-site

  publish-note-docs:
    # The user documentation under docs/ is published at
    # note.theloommethod.org, but the site that serves it is built and deployed
    # from app-note-docs-site, whose workflow only wakes for its own pushes.
    # Left alone, a merge here changed the documentation without publishing it.
    # This asks that repository to rebuild and redeploy, which it does on the
    # same terms as a push of its own.
    #
    # Only once the documentation is known to render: the site is built from
    # this branch above, and a merge that cannot be rendered is not one to
    # publish.
    #
    # And only when the published site would come out different. docs/ is the
    # documentation the site renders; the rest of this repository is the Note
    # corpus and its checks, which the site never reads.
    #
    # The token is a repository secret because a workflow's built-in one is
    # scoped to the repository it runs in and cannot start a run elsewhere. It
    # needs no more than permission to start runs there, so it carries Actions
    # and nothing else: the endpoint below asks a named workflow to run, where
    # a repository dispatch would have demanded write access to the whole of
    # that repository's contents to send the same request.
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the commit this push moved from is present to
          # be compared against.
          fetch-depth: 0
      - id: note-docs
        # An unreadable starting point (a first push, or one whose predecessor
        # a force push has orphaned) publishes rather than guesses: a needless
        # deploy costs two minutes, a missed one leaves the site wrong.
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo 'No readable previous commit; publishing rather than guessing.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "$GITHUB_SHA" -- docs/; then
            echo 'Nothing under docs/ moved; the site would come out identical.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$before" "$GITHUB_SHA" -- docs/
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.note-docs.outputs.changed == 'true'
        run: gh workflow run checks.yml --repo loom-foundation/app-note-docs-site --ref main
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_BUILD_DEPLOY_TOKEN }}
